name: Deploy VitePress site to Pages

on:
  # Запуск при пуше в main
  push:
    branches: [main]
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:

# Права для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Один параллельный деплой; новые пуши не отменяют идущий продакшен-деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для lastUpdated (дата из git)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        # Chromium из vitepress-export-pdf нужен только для локальной генерации PDF,
        # в сборке сайта не используется — не качаем его в CI.
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
